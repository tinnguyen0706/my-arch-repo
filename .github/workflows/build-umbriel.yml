name: Build and Publish Umbriel Repo

on:
  schedule:
    # Chạy tự động mỗi ngày vào 02:00 UTC (09:00 sáng VN)
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: umbriel-build
  cancel-in-progress: false

env:
  REPO_DB_NAME: myrepo
  RELEASE_TAG: repository

jobs:
  build-portal:
    name: Build xdg-desktop-portal-umbriel-git
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3
    steps:
      - name: Configure pacman sandbox and install dependencies
        run: |
          set -euo pipefail
          sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git sudo github-cli fakeroot binutils pacman-contrib paru curl jq
          id builder >/dev/null 2>&1 || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Fetch and Build Portal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /build/output /github/workspace/artifacts
          chown -R builder:builder /build /github/workspace/artifacts
          cd /build

          sudo -u builder git clone --depth=1 https://aur.archlinux.org/xdg-desktop-portal-umbriel-git.git pkg
          cd pkg

          # Tính toán phiên bản pkgver thực tế từ git upstream
          sudo -u builder makepkg -od --noprepare --skipinteg
          EXPECTED_PKG=$(sudo -u builder makepkg --packagelist | head -n 1 | xargs -n 1 basename)
          EXPECTED_PKG="${EXPECTED_PKG//:/.}"
          echo "Expected package: $EXPECTED_PKG"

          # Kiểm tra nếu phiên bản này đã tồn tại trên Release thì tải về, không cần build lại
          ALREADY_EXISTS=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$EXPECTED_PKG"; then
            echo "Package $EXPECTED_PKG is already built on Release. Downloading cached artifact."
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /build/output --pattern "$EXPECTED_PKG"; then
              ALREADY_EXISTS=true
            fi
          fi

          if [[ "$ALREADY_EXISTS" == "false" ]]; then
            echo "Building $EXPECTED_PKG..."
            sudo -u builder paru -B --noconfirm --skipreview --nocheck -i .
            mv *.pkg.tar.zst /build/output/
          fi

          # Đổi dấu hai chấm thành chấm để tránh lỗi artifact upload
          for f in /build/output/*:* ; do
            if [[ -f "$f" ]]; then
              mv "$f" "${f//:/.}"
            fi
          done

          cp /build/output/*.pkg.tar.zst /github/workspace/artifacts/

      - name: Upload Portal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-pkg
          path: /github/workspace/artifacts/*.pkg.tar.zst
          retention-days: 1

  build-umbriel:
    name: Build umbriel-git
    needs: build-portal
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3
    steps:
      - name: Configure pacman sandbox and install dependencies
        run: |
          set -euo pipefail
          sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git sudo github-cli fakeroot binutils pacman-contrib paru curl jq
          id builder >/dev/null 2>&1 || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Download Portal Artifact and Install
        uses: actions/download-artifact@v4
        with:
          name: portal-pkg
          path: /tmp/portal

      - name: Install portal dependency
        run: |
          cd /tmp/portal
          pacman -U --noconfirm *.pkg.tar.zst

      - name: Fetch and Build Umbriel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /build/output /github/workspace/artifacts
          chown -R builder:builder /build /github/workspace/artifacts
          cd /build

          sudo -u builder git clone --depth=1 https://aur.archlinux.org/umbriel-git.git pkg
          cd pkg

          # Tính toán phiên bản thực tế từ git upstream
          sudo -u builder makepkg -od --noprepare --skipinteg
          EXPECTED_PKG=$(sudo -u builder makepkg --packagelist | head -n 1 | xargs -n 1 basename)
          EXPECTED_PKG="${EXPECTED_PKG//:/.}"
          echo "Expected package: $EXPECTED_PKG"

          # Kiểm tra nếu phiên bản này đã tồn tại trên Release thì tải về
          ALREADY_EXISTS=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$EXPECTED_PKG"; then
            echo "Package $EXPECTED_PKG is already built on Release. Downloading cached artifact."
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /build/output --pattern "$EXPECTED_PKG"; then
              ALREADY_EXISTS=true
            fi
          fi

          if [[ "$ALREADY_EXISTS" == "false" ]]; then
            echo "Building $EXPECTED_PKG..."
            sudo -u builder paru -B --noconfirm --skipreview --nocheck .
            mv *.pkg.tar.zst /build/output/
          fi

          # Đổi dấu hai chấm thành chấm để tránh lỗi artifact upload
          for f in /build/output/*:* ; do
            if [[ -f "$f" ]]; then
              mv "$f" "${f//:/.}"
            fi
          done

          cp /build/output/*.pkg.tar.zst /github/workspace/artifacts/

      - name: Upload Umbriel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbriel-pkg
          path: /github/workspace/artifacts/*.pkg.tar.zst
          retention-days: 1

  publish:
    name: Update Database and Publish Release
    needs: [build-portal, build-umbriel]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Install pacman tools
        run: |
          sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
          pacman -Syu --noconfirm --needed github-cli pacman-contrib

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/output
          merge-multiple: true

      - name: Create Repo DB and Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/output
          shopt -s nullglob
          pkgs=( *.pkg.tar.zst )

          if (( ${#pkgs[@]} == 0 )); then
            echo "Không tìm thấy file package nào. Dừng."
            exit 1
          fi

          echo "Packages to publish: ${pkgs[*]}"

          # Kiểm tra hoặc tạo release nếu chưa có
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Arch Package Repository" \
              --notes "Automated build for umbriel-git and dependencies."
          fi

          # Tải các gói cũ đang có trên release (nếu có) để tạo database trọn vẹn
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.pkg.tar.zst" 2>/dev/null || true

          # Tạo cơ sở dữ liệu pacman (.db.tar.gz và .files.tar.gz)
          pkgs_all=( *.pkg.tar.zst )
          repo-add "${REPO_DB_NAME}.db.tar.gz" "${pkgs_all[@]}"

          # Upload tất cả package và database
          gh release upload "$RELEASE_TAG" "${pkgs_all[@]}" "${REPO_DB_NAME}".db* "${REPO_DB_NAME}".files* --repo "$GITHUB_REPOSITORY" --clobber

          RELEASE_NOTES=$(cat <<EOF
          ### 📦 Umbriel Auto-Build Status
          **Last Updated:** $(date -u '+%Y-%m-%d %H:%M UTC')
          $(printf -- '- %s\n' "${pkgs_all[@]}")
          EOF
          )
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes "$RELEASE_NOTES"
