name: Build and Publish Arch Repository (v3 & v4)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/sync-aur.yml'
      - 'README.md'
      - 'packages.txt'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-repo
  cancel-in-progress: true

env:
  RELEASE_TAG: repository

jobs:
  prepare:
    name: Scan packages
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.scan.outputs.has_packages }}
      has_wave1: ${{ steps.scan.outputs.has_wave1 }}
      has_wave2: ${{ steps.scan.outputs.has_wave2 }}
      matrix_wave1: ${{ steps.scan.outputs.matrix_wave1 }}
      matrix_wave2: ${{ steps.scan.outputs.matrix_wave2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Scan directories and generate tiered matrices
        id: scan
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: scanning all package directories..."
            pkgs=()
            for dir in */; do
              [ -d "$dir" ] || continue
              dir_name="${dir%/}"
              case "$dir_name" in
                .github|.sync-staging|output) continue ;;
              esac
              if [ -f "$dir_name/PKGBUILD" ]; then
                pkgs+=("$dir_name")
              fi
            done
          else
            echo "Push trigger: scanning changed package directories..."
            mapfile -t changed_dirs < <(git diff --name-only HEAD~1 HEAD | awk -F'/' 'NF > 1 {print $1}' | sort -u)
            pkgs=()
            for d in "${changed_dirs[@]}"; do
              [ -z "$d" ] && continue
              case "$d" in
                .github|.sync-staging|output) continue ;;
              esac
              if [ -f "$d/PKGBUILD" ]; then
                pkgs+=("$d")
              fi
            done
          fi

          if (( ${#pkgs[@]} == 0 )); then
            echo "No packages changed in this merge/push."
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "has_wave1=false" >> "$GITHUB_OUTPUT"
            echo "matrix_wave1=[]" >> "$GITHUB_OUTPUT"
            echo "has_wave2=false" >> "$GITHUB_OUTPUT"
            echo "matrix_wave2=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_packages=true" >> "$GITHUB_OUTPUT"

          wave1=()
          wave2=()
          for p in "${pkgs[@]}"; do
            case "$p" in
              open-wallpaper-engine|umbriel-git|office-craft)
                wave2+=("$p")
                ;;
              *)
                wave1+=("$p")
                ;;
            esac
          done

          if (( ${#wave1[@]} > 0 )); then
            echo "has_wave1=true" >> "$GITHUB_OUTPUT"
            echo "matrix_wave1=$(python3 .github/scripts/generate-matrix.py "${wave1[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "has_wave1=false" >> "$GITHUB_OUTPUT"
            echo "matrix_wave1=[]" >> "$GITHUB_OUTPUT"
          fi

          if (( ${#wave2[@]} > 0 )); then
            echo "has_wave2=true" >> "$GITHUB_OUTPUT"
            echo "matrix_wave2=$(python3 .github/scripts/generate-matrix.py "${wave2[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "has_wave2=false" >> "$GITHUB_OUTPUT"
            echo "matrix_wave2=[]" >> "$GITHUB_OUTPUT"
          fi

  build_wave1:
    name: "Build Wave 1: ${{ matrix.package }} (${{ matrix.target.arch }})"
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.has_wave1 == 'true' }}
    container:
      image: cachyos/cachyos-v3
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_wave1) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install base dependencies
        run: .github/scripts/install-build-deps.sh

      - name: Configure makepkg for ${{ matrix.target.arch }}
        run: .github/scripts/setup-makepkg.sh "${{ matrix.target.arch }}" "${{ matrix.target.profile }}" "${{ matrix.target.pkgcarch }}"

      - name: Configure pacman options and existing repository
        env:
          DB_NAME: ${{ matrix.target.db }}
        run: |
          set -euo pipefail
          if curl -sSLf "https://arch.tinhiem.id.vn/${DB_NAME}.db" -o /dev/null 2>/dev/null; then
          {
            echo ""
            echo "[$DB_NAME]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = https://arch.tinhiem.id.vn/"
          } >> /etc/pacman.conf
          fi
          pacman -Sy

      - name: Fix workspace ownership for build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build, Cache and Fallback Logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build-package.sh "${{ matrix.package }}" "${{ matrix.target.db }}" "${{ matrix.target.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target.arch }}-${{ matrix.package }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1

  build_wave2:
    name: "Build Wave 2: ${{ matrix.package }} (${{ matrix.target.arch }})"
    needs: [prepare, build_wave1]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.outputs.has_wave2 == 'true' }}
    container:
      image: cachyos/cachyos-v3
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_wave2) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install base dependencies
        run: .github/scripts/install-build-deps.sh

      - name: Configure makepkg for ${{ matrix.target.arch }}
        run: .github/scripts/setup-makepkg.sh "${{ matrix.target.arch }}" "${{ matrix.target.profile }}" "${{ matrix.target.pkgcarch }}"

      - name: Configure pacman options and existing repository
        env:
          DB_NAME: ${{ matrix.target.db }}
        run: |
          set -euo pipefail
          if curl -sSLf "https://arch.tinhiem.id.vn/${DB_NAME}.db" -o /dev/null 2>/dev/null; then
          {
            echo ""
            echo "[$DB_NAME]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = https://arch.tinhiem.id.vn/"
          } >> /etc/pacman.conf
          fi
          pacman -Sy

      - name: Fix workspace ownership for build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Download wave 1 artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: /tmp/wave1-artifacts
          pattern: pkg-*
          merge-multiple: true

      - name: Install freshly built wave 1 packages
        run: |
          shopt -s nullglob
          pkgs=( /tmp/wave1-artifacts/*.pkg.tar.zst )
          if (( ${#pkgs[@]} > 0 )); then
            echo "Installing freshly built wave 1 packages into build container:"
            printf -- '- %s\n' "${pkgs[@]}"
            pacman -U --noconfirm --needed "${pkgs[@]}" 2>/dev/null || true
          fi

      - name: Build, Cache and Fallback Logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build-package.sh "${{ matrix.package }}" "${{ matrix.target.db }}" "${{ matrix.target.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target.arch }}-${{ matrix.package }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1

  publish:
    name: Generate Pacman DB & Publish Release
    needs: [prepare, build_wave1, build_wave2]
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.build_wave1.result == 'success' || needs.build_wave1.result == 'skipped') && (needs.build_wave2.result == 'success' || needs.build_wave2.result == 'skipped') && needs.prepare.outputs.has_packages == 'true' }}
    container:
      image: cachyos/cachyos-v3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
          pacman -Syu --noconfirm --needed github-cli pacman-contrib jq openssh rsync curl python

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Generate pacman databases, deploy to VPS and update Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/deploy-vps.sh \
            "${{ secrets.VPS_SSH_KEY }}" \
            "${{ secrets.VPS_HOST }}" \
            "${{ secrets.VPS_USER }}" \
            "${{ github.repository }}" \
            "${{ env.RELEASE_TAG }}" \
            "${{ github.sha }}"
